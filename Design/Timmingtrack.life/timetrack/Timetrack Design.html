<!doctype html>
<html lang="pt-BR" data-theme="dark" data-density="comfortable">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Timetrack — direções de design</title>
  <link rel="stylesheet" href="tokens.css" />
  <style>
    html, body { margin: 0; height: 100%; background: #0e0e10; }
    #root { height: 100vh; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="data.js"></script>
  <script type="text/babel" src="dc-canvas.jsx"></script>
  <script type="text/babel" src="parts.jsx"></script>
  <script type="text/babel" src="cockpit.jsx"></script>
  <script type="text/babel" src="calendar.jsx"></script>
  <script type="text/babel" src="projects.jsx"></script>
  <script type="text/babel" src="clients.jsx"></script>
  <script type="text/babel" src="workspace.jsx"></script>
  <script type="text/babel" src="newproject.jsx"></script>
  <script type="text/babel" src="gcal.jsx"></script>
  <script type="text/babel" src="foco.jsx"></script>
  <script type="text/babel" src="reports.jsx"></script>
  <script type="text/babel" src="settings.jsx"></script>
  <script type="text/babel" src="tweakbar.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>

  <!-- Auto-heal the canvas view: if a saved pan/zoom leaves content off-screen
       or absurdly tiny, snap back to a sensible home view once it mounts.
       Polls because Babel mounts the canvas after the load event. -->
  <script>
  (function () {
    function tf(world) {
      var m = (world.style.transform || '').match(/translate3d\(([-\d.]+)px,\s*([-\d.]+)px[^)]*\)\s*scale\(([-\d.]+)\)/);
      return m ? { x: +m[1], y: +m[2], s: +m[3] } : { x: 0, y: 0, s: 1 };
    }
    var done = false, tries = 0;
    function attempt() {
      if (done) return;
      tries++;
      var vp = document.querySelector('.design-canvas');
      var world = vp && vp.querySelector(':scope > div');
      if (vp && world) {
        done = true;
        var t = tf(world), vw = vp.clientWidth, vh = vp.clientHeight;
        var cw = world.scrollWidth * t.s, ch = world.scrollHeight * t.s;
        var offscreen = (t.x > vw - 80) || (t.y > vh - 80) || (t.x + cw < 80) || (t.y + ch < 80);
        if (t.s < 0.14 || offscreen) {
          var r = vp.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2, target = 0.42;
          vp.dispatchEvent(new WheelEvent('wheel', { ctrlKey: true, deltaX: 0.5, deltaY: -Math.log(target / t.s) / 0.01, deltaMode: 0, clientX: cx, clientY: cy, bubbles: true, cancelable: true }));
          var n = tf(world);
          vp.dispatchEvent(new WheelEvent('wheel', { deltaX: (n.x - (70 - 60 * target)) || 0.3, deltaY: (n.y - (50 - 60 * target)) + 0.1, deltaMode: 0, clientX: cx, clientY: cy, bubbles: true, cancelable: true }));
        }
        return;
      }
      if (tries < 30) setTimeout(attempt, 350);
    }
    setTimeout(attempt, 350);
  })();
  </script>
</body>
</html>
